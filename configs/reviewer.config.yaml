# Configuration file for Upsource AI Reviewer

# Polling settings
polling:
  intervalSeconds: 60  # How often to check for new reviews

metrics:
  enabled: true
  listenAddress: ":2112"
  path: "/metrics"

# Persist complete prompts and raw LLM responses in paired files per review attempt.
llmLogging:
  enabled: false
  directory: "/var/log/upsource-ai-reviewer/llm"

replies:
  enabled: true            # Reply to humans who responded in threads the bot started
  logMessages: false       # Emit replier log messages
  activeProvider: "openai"     # Use specific provider for replies (optional, defaults to active provider)
  maxPerThread: 3          # Hard cap on bot replies per thread
  systemMessageFile: "../prompts/reply-system-message.md"

providers:
  gemini:
    apiKey: "***"
    model: "gemini-2.5-flash"
    maxTokens: 0
    requestTimeout: 300s

  # OpenAI settings
  openai:
    endpoint: "https://api.openai.com/v1/chat/completions"
    apiKey: "sk-proj-****"
    model: "gpt-5-mini"
    maxTokens: 0
    temperature: 0
    requestTimeout: 300s

  anthropic:
    apiKey: "sk-ant-****"
    model: "claude-opus-4-7"
    maxTokens: 0
    requestTimeout: 300s

  agent:
    # When the agent provider is active the review runs in fully agentic mode:
    # the review's repo is cloned at its branch and the command runs with that
    # clone as its working directory, so an agentic CLI can explore the real code.
    # The command must read the prompt (incl. the diff) from stdin and print the
    # JSON ReviewComment array to stdout. Requires `git` on the host.
    command: ".codex exec" # Command that reads prompt from stdin and writes response to stdout
#    command: "HOME=/var/lib/upsource-ai-reviewer/claude-home claude -p --output-format text --permission-mode dontAsk
#      --settings /var/lib/upsource-ai-reviewer/claude-reviewer-settings.json
#      --mcp-config /var/lib/upsource-ai-reviewer/claude-mcp.json --strict-mcp-config
#      'Return only the JSON array requested in the piped input.'"
    cloneDir: "./repos" # base dir for per-review clones; empty uses the OS temp dir
    requestTimeout: 300s

upsource:
  baseUrl: "https://upsource.com"
  username: "user"
  password: "***"
  reviewedLabel: "AI-Reviewed"  # Label to add to reviews that have been AI-reviewed
#  invitationLabel: "ai-invited" # Label to check for to determine if the AI reviewer is invited. Can be empty if all reviews should be processed.
  query: "state: open #my"

# Agentic review uses gitlab to clone repos
gitlab:
  baseUrl: "https://gitlab.com"
  accessToken: "glpat-***"

review:
  activeProvider: "gemini"     # Use specific provider for review (optional, defaults to active provider)
  maxPerReview: 10  # Maximum number of comments per review
  systemMessageFile: "../prompts/reviewer/system-message.md"
  userPromptTemplateFile: "../prompts/reviewer/user-prompt-template.md"
